services:
  watchlist:
    image: ghcr.io/alexgg05/ag-watchlist:${WATCHLIST_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${WATCHLIST_PORT:-3000}:3000"
    environment:
      APP_URL: ${APP_URL:?Öffentliche HTTPS-Adresse setzen}
      SMTP_URL: ${SMTP_URL:?SMTP-Verbindungs-URL setzen}
      STREAMING_AVAILABILITY_API_KEY: ${STREAMING_AVAILABILITY_API_KEY:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:?Absender setzen}
    volumes:
      - watchlist-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  watchlist-data:
